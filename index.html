<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뇽뇽이 앱 모음</title>
<meta name="description" content="뇽뇽이가 만든 앱과 게임을 한곳에서 받아보세요.">
<meta property="og:title" content="뇽뇽이 앱 모음">
<meta property="og:description" content="뇽뇽이가 만든 앱과 게임을 한곳에서 받아보세요.">
<meta property="og:image" content="icons/nyong.png">
<link rel="icon" href="icons/nyong.png">
<style>
  :root { --bg:#f6f4fa; --card:#fff; --ink:#1d1828; --muted:#6f6a7d; --line:#e7e3ef; --accent:#ff7a3d; --btn-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16131e; --card:#221d2e; --ink:#f4f1fa; --muted:#a39db3; --line:#322b42; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:40px 16px 56px; }
  header { text-align:center; margin-bottom:28px; }
  header img { width:88px; height:88px; border-radius:22px; }
  h1 { font-size:26px; margin:14px 0 6px; }
  header p { margin:0; color:var(--muted); font-size:15px; }
  .app { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:14px; margin-bottom:12px; }
  .app img { width:64px; height:64px; border-radius:15px; flex:none; }
  .info { flex:1; min-width:0; }
  .name { font-weight:700; font-size:17px; }
  .desc { color:var(--muted); font-size:13.5px; margin-top:3px; }
  .btns { display:flex; flex-direction:column; gap:6px; flex:none; }
  .btn { display:block; text-align:center; text-decoration:none; background:var(--accent); color:var(--btn-ink);
    font-weight:700; font-size:14px; padding:10px 16px; border-radius:999px; white-space:nowrap; }
  .btn.sub { background:transparent; color:var(--ink); border:1px solid var(--line); padding:8px 14px; font-size:13px; }
  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:28px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/nyong.png" alt="">
    <h1>뇽뇽이 앱 모음</h1>
    <p>직접 만든 앱과 게임이에요. 눌러서 바로 받아보세요.</p>
  </header>
  <div id="list"></div>
  <footer>아이폰은 앱스토어, 안드로이드는 플레이스토어로 연결돼요.</footer>
</main>
<script src="apps.js"></script>
<script>
  var os = detectOS(), list = document.getElementById("list");
  APPS.forEach(function (a) {
    var btns = "";
    var mine = storeUrl(a, os);
    if (mine) btns = '<a class="btn" href="' + mine + '">받기</a>';
    else {
      if (a.ios) btns += '<a class="btn sub" href="' + storeUrl(a, "ios") + '">App Store</a>';
      if (a.android) btns += '<a class="btn sub" href="' + storeUrl(a, "android") + '">Google Play</a>';
    }
    var el = document.createElement("div");
    el.className = "app";
    el.innerHTML = '<img src="icons/' + a.id + '.png" alt="">' +
      '<div class="info"><div class="name"></div><div class="desc"></div></div><div class="btns">' + btns + '</div>';
    el.querySelector(".name").textContent = a.name;
    el.querySelector(".desc").textContent = a.desc;
    list.appendChild(el);
  });
</script>
</body>
</html>
